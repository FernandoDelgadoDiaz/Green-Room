name: Build catalog data

# New catalog shows: snapshots the RSS feed of shows with no dataset yet (scripts/fetch-rss.ts) and,
# when the repository secrets SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET exist, the episode lists of
# Spotify-only shows (scripts/fetch-spotify.ts). Then rebuilds the catalog and the people data and
# commits the result to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: ['feat/**']
    paths: ['data/catalog/sources.json', 'data/catalog/spotify-requested-at', 'scripts/fetch-spotify.ts', 'scripts/fetch-rss.ts', '.github/workflows/build-spotify.yml']

permissions:
  contents: write

concurrency:
  group: catalog-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
    steps:
      - name: Check Spotify credentials
        id: creds
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_CLIENT_SECRET" ]; then
            echo "Spotify secrets are not set: Spotify shows are skipped."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: data/raw/wd-cache
          key: wd-cache-${{ github.run_id }}
          restore-keys: wd-cache-
      - run: npx tsx scripts/fetch-rss.ts
      - run: npx tsx scripts/fetch-spotify.ts
        if: steps.creds.outputs.ok == 'true'
      - run: npm run catalog:build
      - run: npm run people:build
      - run: npx tsc -p tsconfig.json --noEmit
      - name: Commit catalog and people data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/podcasts core/datasets.ts data/people.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Data: new shows, catalog and people (workflow run ${{ github.run_id }})"
          # Data files are regenerated from scratch: on a conflict with a concurrent data run, keep this one.
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push
